name: Development Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync

      - name: Lint with pre-commit
        run: uv run pre-commit run --all-files

      - name: Run Tests
        run: uv run pytest

      # The anthropic backend is import-guarded, so the suite must pass both
      # with and without the optional SDK present.
      - name: Run Tests with the anthropic extra installed
        run: uv sync --extra anthropic && uv run pytest
