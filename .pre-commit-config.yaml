repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        types: [python]
      - id: end-of-file-fixer
        types: [python]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=25000']
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.2
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
